<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Mep: chef's notebook and prep planner</title>
    <meta name="description" content="A chef's notebook and prep planner. Your data stays on your phone." />
    <!-- The browser bar and status bar match the top bar (--color-surface-raised). -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1715" media="(prefers-color-scheme: dark)" />
    <!-- iPhone Home Screen: the name under the icon, and dark status-bar text. -->
    <meta name="apple-mobile-web-app-title" content="Mep" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Icon, apple-touch-icon and splash-screen links are added at build time (pwa-assets.config.ts). -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
