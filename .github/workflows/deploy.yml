# Builds the app and publishes dist/ to GitHub Pages on every push to main.
# The Pages URL is the app's permanent install address: IndexedDB data is tied
# to the origin, so it must never move.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Never ship a version whose tests fail: the phone holds the only copy.
      - run: npm test
      - run: npm run build
      # Pages has no "serve index.html for every path" setting, but it serves
      # 404.html for unknown paths, so a reload on /mep-chef-notebook/library
      # still opens the app (which then shows the right tab).
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
